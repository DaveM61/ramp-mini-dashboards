<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAMP Gauge</title>

  <!-- iOS / Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RAMP Gauge" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    :root {
      --bg: #0f172a;
      --panel: #020617;
      --card: #020617;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --negative: #6b1a1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      background: var(--panel);
    }

    .meta {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
      max-width: 640px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card.negative {
      background: var(--negative);
    }

    .label {
      font-size: 12px;
      color: var(--muted);
    }

    .value {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.1px;
    }

    .footer {
      height: 8px;
    }
  </style>
</head>

<body>
  <div class="header">RAMP Gauge</div>
  <div id="meta" class="meta"></div>

  <div id="grid" class="grid"></div>

  <div class="footer"></div>

  <script>
    function fmt(n) {
      return Math.round(n).toLocaleString();
    }

    fetch("data/ramp_gauge.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("Failed to load JSON");
        return r.json();
      })
      .then(data => {
        const meta = document.getElementById("meta");
        meta.textContent = `As of ${data.as_of}`;

        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        data.categories.forEach(c => {
          const card = document.createElement("div");
          card.className = "card" + (c.balance < 0 ? " negative" : "");

          card.innerHTML = `
            <div class="label">${c.label}</div>
            <div class="value">$${fmt(c.balance)}</div>
          `;

          grid.appendChild(card);
        });
      })
      .catch(err => {
        const grid = document.getElementById("grid");
        grid.innerHTML = `
          <div class="card negative">
            <div class="label">Error</div>
            <div class="value">Data unavailable</div>
          </div>
        `;
        console.error(err);
      });
  </script>
</body>
</html>

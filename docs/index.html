<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAMP Gauge</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}

/* Header */
.header {
    padding: 16px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    background: #020617;
}

/* Hero */
.hero {
    margin: 16px;
    padding: 20px;
    background: #020617;
    border-radius: 16px;
    text-align: center;
}

.hero-label {
    font-size: 14px;
    opacity: 0.8;
}

.hero-value {
    margin-top: 6px;
    font-size: 36px;
    font-weight: 700;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
}

/* Cards */
.card {
    background: #020617;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
}

.card.negative {
    background: #7f1d1d;
}

.label {
    font-size: 14px;
    opacity: 0.85;
}

.value {
    margin-top: 8px;
    font-size: 26px;
    font-weight: 700;
}

.footer {
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    padding: 12px 0 20px;
}
</style>
</head>

<body>

<div class="header">RAMP Gauge</div>

<div class="hero">
    <div class="hero-label">Total Available</div>
    <div id="heroValue" class="hero-value">$—</div>
</div>

<div id="grid" class="grid"></div>

<div id="asOf" class="footer"></div>

<script>
fetch("data/ramp_gauge.json")
    .then(r => r.json())
    .then(data => {
        // Hero total
        const total = data.total_balance ?? 0;
        document.getElementById("heroValue").textContent =
            total.toLocaleString("en-US", {
                style: "currency",
                currency: "USD",
                maximumFractionDigits: 0
            });

        // Category cards
        const grid = document.getElementById("grid");
        data.categories.forEach(c => {
            const card = document.createElement("div");
            card.className = "card" + (c.balance < 0 ? " negative" : "");

            card.innerHTML = `
                <div class="label">${c.label}</div>
                <div class="value">
                    ${c.balance.toLocaleString("en-US", {
                        style: "currency",
                        currency: "USD",
                        maximumFractionDigits: 0
                    })}
                </div>
            `;

            grid.appendChild(card);
        });

        // As-of footer
        document.getElementById("asOf").textContent =
            "As of " + data.as_of;
    })
    .catch(err => {
        document.getElementById("heroValue").textContent = "Error";
        console.error(err);
    });
</script>

</body>
</html>
